name: Android Release APK

on:
  push:
    branches: [android]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ platform folder is generated, not checked in
      # (gradle-wrapper.jar is binary and shouldn't live in git by hand).
      - name: Ensure android platform scaffold exists
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org io.github.devboffin --project-name sftp_forge .
          fi

      # flutter create only adds INTERNET permission to the DEBUG manifest
      # (needed for the Dart VM debug service) — the release/main manifest
      # ships without it, so a release build has no network access at all.
      - name: Add INTERNET permission to the release manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n\n    <application#' "$MANIFEST"
          cat "$MANIFEST"

      # flutter_plugin_android_lifecycle (pulled in transitively by
      # file_picker) requires compileSdk 36+.
      # 1) local.properties' flutter.compileSdkVersion covers the app
      #    module (read via the flutter.compileSdkVersion extension).
      # 2) Plugin subprojects like file_picker's own android/build.gradle
      #    do NOT read that — force compileSdk on every Android library
      #    subproject directly instead.
      - name: Pin flutter.compileSdkVersion to 36
        run: |
          printf '\n' >> android/local.properties
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          cat android/local.properties

      - name: Force compileSdk 36 on all Android library subprojects
        run: |
          cat >> android/build.gradle.kts << 'EOF'

          subprojects {
              val forceCompileSdk36 = {
                  extensions.findByType<com.android.build.gradle.LibraryExtension>()?.let {
                      it.compileSdk = 36
                  }
              }
              // Run immediately if this subproject already evaluated
              // (calling afterEvaluate on an evaluated project throws);
              // otherwise defer, so it overrides whatever the plugin's
              // own build.gradle sets for itself later in its own script.
              if (state.executed) forceCompileSdk36() else afterEvaluate { forceCompileSdk36() }
          }
          EOF
          cat android/build.gradle.kts

      - run: flutter pub get

      - name: Generate launcher icon from assets/icon/icon.png
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sftp-forge-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
