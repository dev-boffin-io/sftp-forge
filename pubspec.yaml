name: sftp_forge
description: SFTP Forge — SSH/SFTP connection manager (Android)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dartssh2: ^2.9.0
  xterm: ^3.5.0
  path_provider: ^2.1.3
  file_picker: ^8.0.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
